<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Maintenance Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#233047">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Shown when a newer build is live than the one currently loaded -->
<div class="update-banner" id="updateBanner">
  <span>A new version is available.</span>
  <button id="updateReloadBtn">Reload</button>
</div>

<!-- Login screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-eyebrow">Maintenance</div>
    <h1 class="login-title">Maintenance Tracker</h1>

    <div class="login-hint">Sign in</div>
    <input id="usernameInput" class="text-input" type="text" autocomplete="username" placeholder="Username" autocapitalize="off" autocorrect="off">
    <input id="pinInput" class="pin-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
    <div class="login-error" id="loginError"></div>
    <div class="login-actions">
      <button class="btn btn-primary" id="pinSubmitBtn" style="flex:1;">Sign in</button>
    </div>
    <div class="version-tag" id="versionTagLogin"></div>
  </div>
</div>

<!-- App -->
<div id="appRoot" style="display:none;">

<header>
  <div class="titles">
    <div class="eyebrow" id="siteEyebrow">Maintenance</div>
    <h1>Maintenance Tracker</h1>
    <div class="sub" id="summaryLine">Loading…</div>
    <div class="version-tag version-tag-header" id="versionTagHeader"></div>
  </div>
  <div class="header-actions">
    <span class="role-badge" id="roleBadge"></span>
    <button class="icon-btn" id="notifBtn" aria-label="Notifications">
      🔔<span class="notif-count" id="notifCount"></span>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    <button class="icon-btn" id="logoutBtn" aria-label="Log out">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</header>

<div class="stats-bar" id="statsBar"></div>

<div class="controls">
  <div class="search-row">
    <input id="searchInput" type="text" placeholder="Filter by room number…">
    <button id="showAllBtn" class="show-all-btn">Show all</button>
  </div>
  <div class="chips" id="statusChips"></div>
</div>

<div id="list"></div>

<button class="fab" id="fabAdd" aria-label="Add job">+</button>

<!-- Job sheet (maintenance: full edit. others: read-only view) -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h2 id="sheetTitle">New job</h2>
    <div class="row2">
      <div class="field">
        <label>Room</label>
        <select id="f_room">
          <option value="">Select room…</option>
        </select>
      </div>
      <div class="field">
        <label>Area</label>
        <select id="f_area">
          <option value="">Select area…</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Quick pick</label>
      <select id="f_issuePreset">
        <option value="">Other (type your own)…</option>
      </select>
    </div>
    <div class="field">
      <label>Issue</label>
      <textarea id="f_issue" rows="3" placeholder="e.g. Replace room controller — repeated P10 comms faults"></textarea>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="f_status">
        <option>Open</option>
        <option>In Progress</option>
        <option>Awaiting Parts</option>
        <option>Done</option>
      </select>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="f_notes" rows="2" placeholder="Optional running notes"></textarea>
    </div>
    <div class="audit-line" id="sheetAudit"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelBtn">Close</button>
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">Delete</button>
      <button class="btn btn-primary" id="saveBtn">Save job</button>
    </div>
  </div>
</div>

<!-- Report sheet (housekeeping: raise a new problem against an existing room) -->
<div class="sheet-backdrop" id="reportBackdrop">
  <div class="sheet">
    <h2>Report a problem</h2>
    <div class="field">
      <label>Room</label>
      <select id="r_room">
        <option value="">Select room…</option>
      </select>
    </div>
    <div class="field">
      <label>Quick pick</label>
      <select id="r_issuePreset">
        <option value="">Other (type your own)…</option>
      </select>
    </div>
    <div class="field">
      <label>What's wrong?</label>
      <textarea id="r_issue" rows="3" placeholder="Describe the problem"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="reportCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="reportSubmitBtn">Submit report</button>
    </div>
  </div>
</div>

<!-- Notifications panel: what's new since you last looked -->
<div class="sheet-backdrop" id="notifBackdrop">
  <div class="sheet">
    <h2>Notifications</h2>
    <div id="notifList"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="notifCloseBtn">Close</button>
    </div>
  </div>
</div>

<!-- Settings sheet (maintenance only) -->
<div class="sheet-backdrop" id="settingsBackdrop">
  <div class="sheet">
    <h2>Settings</h2>

    <div class="settings-section">
      <h3>Site</h3>
      <div class="field">
        <label>Hotel / site name</label>
        <input id="s_siteName" type="text" placeholder="e.g. Leonardo Hotel Sheffield">
      </div>
    </div>

    <div class="settings-section">
      <h3>Areas</h3>
      <div class="tag-list" id="areaTagList"></div>
      <div class="row2">
        <div class="field" style="margin-bottom:0;">
          <input id="s_newArea" type="text" placeholder="Add area, e.g. Bar / Kitchen / 4th Floor">
        </div>
        <button class="btn btn-primary" id="addAreaBtn" style="flex:0 0 auto; padding:11px 16px;">Add</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>Common Issues</h3>
      <div class="tag-list" id="commonIssueTagList"></div>
      <div class="row2">
        <div class="field" style="margin-bottom:0;">
          <input id="s_newCommonIssue" type="text" placeholder="e.g. Bath plug missing / Sink blocked / TV remote missing">
        </div>
        <button class="btn btn-primary" id="addCommonIssueBtn" style="flex:0 0 auto; padding:11px 16px;">Add</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>Rooms</h3>
      <div id="roomList"></div>
      <div class="row2">
        <div class="field" style="margin-bottom:0;">
          <input id="s_newRoomNum" type="text" placeholder="Room no.">
        </div>
        <div class="field" style="margin-bottom:0;">
          <select id="s_newRoomArea">
            <option value="">Select area…</option>
          </select>
        </div>
        <button class="btn btn-primary" id="addRoomBtn" style="flex:0 0 auto; padding:11px 16px;">Add</button>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="closeSettingsBtn">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

</div><!-- /appRoot -->

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
